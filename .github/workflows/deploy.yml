name: Publish site to Cloudflare Pages

# Uploads the committed site/ folder. Runs when a pull request that changes
# site/ is merged to main, or when started by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: bd9d4e37fc43c95ad2d955803243d477
      PROJECT: art-moves
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the Pages project if it does not exist
        run: npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main || echo "Project already exists or could not be created; continuing"
      - name: Upload site/
        run: npx --yes wrangler@4 pages deploy site --project-name="$PROJECT" --branch=main --commit-dirty=true
